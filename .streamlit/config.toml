# ORLANDO
# Streamlit Documentation: https://docs.streamlit.io/develop/api-reference/configuration/config.toml 
# Download the VSCode extension "TOML Language Support"

[theme]
primaryColor = "#D97706"  # Warm amber (owl's eye and accent) - kept from logo
backgroundColor = "#F0F4F1"  # Light sage green (main background) - much brighter
secondaryBackgroundColor = "#E8EDE9"  # Very light gray-green (panel/sidebar background) - brighter
textColor = "#1F2937"  # Dark gray (primary text) - better contrast on light bg
borderColor = "#9CA3AF" # Medium gray border color
font = "sans serif"
